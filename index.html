<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puppet Fragment Bidding</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--ink:#14213d;--mut:#5b6b82;--line:#cfd8e3;--card:#fff;--ice:#1b7f8c;--ice2:#dff1f3;--amb:#c98a1b;--amb2:#fbf1dc;--red:#b3402f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1826;--ink:#e6edf7;--mut:#93a3ba;--line:#26354b;--card:#16233a;--ice:#4fc3d1;--ice2:#12333b;--amb:#e3a73a;--amb2:#3a2e14;--red:#ef7d6c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
header,nav,main{max-width:860px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:24px;gap:12px;flex-wrap:wrap}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",Georgia,serif;margin:0}
h1{font-size:28px;font-weight:800}
.sw{font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center}
nav{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px inherit;color:var(--mut);cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--ice)}
main{padding-top:18px;padding-bottom:60px}
.adm{display:none!important}body.admin .adm{display:revert!important}
body.admin .vo{display:none}
body.admin button.adm,body.admin label.adm,body.admin span.adm{display:inline-flex!important}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--ice)}
button.pri{background:var(--ice);border-color:var(--ice);color:#fff;font-weight:600}
button.del{color:var(--red)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
select,input[type=text],input[type=number],input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.auc{display:grid;grid-template-columns:96px 1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.auc.past{opacity:.55}
.dt{background:var(--ice2);padding:14px 8px;text-align:center;border-right:1px solid var(--line)}
.dt .big{font-size:38px;font-weight:800;line-height:1}
.dt small{display:block;color:var(--mut)}
.bd{padding:14px 16px}
.gp{margin-bottom:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.slots{background:var(--amb2);color:var(--amb);font-weight:600;border-radius:99px;padding:1px 10px;font-size:14px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
li .n{flex:1}li small{color:var(--mut)}
.ok{color:var(--ice);font-weight:600}
.empty{color:var(--mut);font-style:italic}
details summary{cursor:pointer;color:var(--mut);font-size:14px;margin-top:4px}
.req{border-top:2px solid var(--line);padding-top:8px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
@media(max-width:520px){.auc{grid-template-columns:70px 1fr}.dt .big{font-size:28px}}
</style>
</head>
<body>
<header><h1>Puppet Fragment Bidding</h1><button data-act="refresh">Refresh</button> <label class="sw"><input type="checkbox" id="admtog" autocomplete="off"> Admin mode<small id="admst"></small></label></header>
<nav><button data-tab="auctions" class="on">Auctions</button><button data-tab="members">Members</button><button data-tab="admin" class="adm">Admin</button></nav>
<main id="v"></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxQ-cPB-n6hdVMhheHUI9GU1ubEU6cClpzLUAEDIlmYKdjz_zl2-tAmsjpe8Lr40kA/exec'; // Google Apps Script web app URL
const KEY='rocGuildBids_v2',$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>{let id=0;const m=[
['OverDosage','High Wizard',10,2],['Raineru','High Priest',10,2],['Polardan','Bard',10,3],['Aeri3s','High Priest',10,4],['PittyTummy','Bard',10,4],['robeegee','Doram',10,8],['Mark','Doram',10,12],
['Claustrophobic','High Priest',9,0],['Zarry','Biochem',9,1],['aaLalay','Bard',9,2],['DaddyTank','Bard',9,3],['Occin','Doram',9,3],['siggyseo','Biochem',9,5],['Limee','Gunslinger',9,7]
].map(([name,cls,group,base])=>({id:++id,name,cls,group,base,ord:id}));
const A=(date,groups)=>({date,groups,avail:{9:2,10:2}});
return{nid:id+1,members:m,auctions:[A('2026-10-11',[]),A('2026-10-13',[9,10]),A('2026-10-18',[]),A('2026-10-25',[]),A('2026-10-29',[9,10])],history:[],requests:[]}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||DEF();
let tab='auctions',PASS=sessionStorage.getItem('pw')||'',status='',serverEmpty=false;
const live=()=>/^https:/.test(API);
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});return r.json()}
async function pull(){if(!live())return;try{const r=await(await fetch(API)).json();if(r.state){S=r.state;S.members.forEach((m,i)=>{if(m.ord==null)m.ord=i});save();serverEmpty=false}else serverEmpty=true;status=''}catch(e){status='Could not reach the shared sheet. Showing the last saved data.'}render()}
async function push(){if(!live())return;try{const x=await api({action:'save',pass:PASS,state:S});if(x.error)alert(x.error)}catch(e){alert('Could not reach the shared sheet. Try again.')}await pull()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const byId=id=>S.members.find(m=>m.id==id);
const total=m=>m.base+S.history.filter(h=>h.mid==m.id).reduce((a,h)=>a+h.n,0);
const queue=g=>S.members.filter(m=>m.group==g).map(m=>({m,t:total(m)})).sort((a,b)=>a.m.ord-b.m.ord);
let P={};
function plan(){const out={},used={};
  [...S.auctions].sort((a,b)=>a.date<b.date?-1:1).forEach(a=>[...a.groups].sort((x,y)=>x-y).forEach(g=>{
    const q=queue(g).map(x=>x.m),k=a.date+'-'+g,u=used[g]=used[g]||new Set();
    if(a.manual&&a.manual[g]){
      if(q.length&&q.every(m=>u.has(m.id)))u.clear();
      out[k]=a.manual[g].map(id=>q.find(m=>m.id==id)).filter(Boolean);out[k].forEach(m=>u.add(m.id));return}
    const n=Math.min(a.avail[g],q.length);out[k]=[];
    while(out[k].length<n){const pick=()=>q.find(m=>!u.has(m.id)&&!out[k].includes(m));let c=pick();if(!c){u.clear();c=pick()}if(!c)break;out[k].push(c);u.add(c.id)}}));
  return out}
const wins=(d,g)=>S.history.filter(h=>h.date==d&&byId(h.mid)&&byId(h.mid).group==g).reduce((a,h)=>a+h.n,0);
const wonOn=(d,id)=>S.history.some(h=>h.date==d&&h.mid==id);
const aucn=d=>S.auctions.find(a=>a.date==d);
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};

function card(a){
  const d=pd(a.date),past=d<today(),sched=new Set();
  const groups=[...a.groups].sort((x,y)=>x-y);
  const gp=groups.map(g=>{
    const q=queue(g),n=a.avail[g],won=wins(a.date,g),man=a.manual&&a.manual[g];
    const top=(P[a.date+'-'+g]||[]).map(m=>({m,t:total(m)}));top.forEach(x=>sched.add(x.m.id));
    const li=x=>`<li><span class="n">${esc(x.m.name)}</span>${wonOn(a.date,x.m.id)?'<span class="ok">Won</span>':`<button class="adm" data-act="won" data-d="${a.date}" data-m="${x.m.id}">Mark won</button>`}</li>`;
    return`<div class="gp"><div class="gh"><h3>Group ${g}</h3><span><span class="slots">${n} fragment${n==1?'':'s'} available${won?`, ${won} won`:''}</span> <span class="adm"><button data-act="av" data-d="${a.date}" data-g="${g}" data-v="-1" aria-label="Fewer fragments">-</button><button data-act="av" data-d="${a.date}" data-g="${g}" data-v="1" aria-label="More fragments">+</button></span></span></div>
    <ul>${top.length?top.map(li).join(''):(man?'<li class="empty">Bidders not picked yet.</li>':'<li class="empty">No fragments available for this group.</li>')}</ul>
    <div class="row adm"><label><input type="checkbox" data-man="${g}" data-d="${a.date}" ${man?'checked':''}> Pick bidders manually</label></div>
    ${man?`<div class="row adm">${q.map(x=>`<label><input type="checkbox" data-pick="${x.m.id}" data-d="${a.date}" data-g="${g}" ${man.includes(x.m.id)?'checked':''}> ${esc(x.m.name)}</label>`).join('')}</div>`:''}
    </div>`}).join('');
  const reqs=S.requests.map((r,i)=>({r,i})).filter(x=>x.r.date==a.date&&byId(x.r.mid));
  const taken=new Set(reqs.map(x=>x.r.mid));
  const opts=S.members.filter(m=>!sched.has(m.id)&&!taken.has(m.id)).sort((x,y)=>x.group-y.group||x.name.localeCompare(y.name)).map(m=>`<option value="${m.id}">${esc(m.name)} (Group ${m.group})</option>`).join('');
  const rq=`<div class="req"><strong>Extra requests</strong> <small>(for members not scheduled this day)</small>
    <ul>${reqs.length?reqs.sort((x,y)=>total(byId(x.r.mid))-total(byId(y.r.mid))).map(({r,i})=>{const m=byId(r.mid);return`<li><span class="n">${esc(m.name)} <small>Group ${m.group}</small></span>${wonOn(a.date,m.id)?'<span class="ok">Won</span>':`<button class="adm" data-act="won" data-d="${a.date}" data-m="${m.id}">Mark won</button>`}<button class="adm del" data-act="unreq" data-i="${i}">Remove</button></li>`}).join(''):'<li class="empty">No requests yet.</li>'}</ul>
    ${past?'':`<div class="row"><select aria-label="Your name"><option value="">Choose your name</option>${opts}</select><button class="pri" data-act="req" data-d="${a.date}">Request to bid</button></div>`}</div>`;
  const ctl=`<div class="row adm"><span>Groups bidding:</span>${[9,10].map(g=>`<label><input type="checkbox" data-grp="${g}" data-d="${a.date}" ${a.groups.includes(g)?'checked':''}> Group ${g}</label>`).join('')}<button class="del" data-act="delAuc" data-d="${a.date}">Delete auction</button></div>`;
  return`<section class="auc ${past?'past':''}"><div class="dt"><div class="big">${d.getDate()}</div><small>${d.toLocaleDateString('en-US',{month:'short'})}</small><small>${d.toLocaleDateString('en-US',{weekday:'short'})}</small></div><div class="bd">${gp||'<p class="empty">Groups for this day are not assigned yet.</p>'}${ctl}${rq}</div></section>`;
}
function membersView(){
  const opts=[...new Set(S.members.map(m=>m.cls))].map(c=>`<option>${esc(c)}</option>`).join('');
  return'<p>Bidding follows this order. Each auction takes the next members in line, then the rotation starts over.</p>'+[10,9].map(g=>`<h2>Group ${g}</h2><table><tr><th>Turn</th><th>Name</th><th>Class</th><th>Won so far</th><th class="adm"></th></tr>${queue(g).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.m.name)}</td><td><span class="vo">${esc(x.m.cls)}</span><input class="adm" type="text" list="cl" value="${esc(x.m.cls)}" data-cls="${x.m.id}" aria-label="Class for ${esc(x.m.name)}"></td><td>${x.t}</td><td class="adm"><button data-act="move" data-v="-1" data-m="${x.m.id}" aria-label="Move up">Up</button> <button data-act="move" data-v="1" data-m="${x.m.id}" aria-label="Move down">Down</button> <button class="del" data-act="delMem" data-m="${x.m.id}">Remove</button></td></tr>`).join('')}</table>`).join('')+
  `<div class="box adm"><h3>Add member</h3><div class="row"><input type="text" id="nm" placeholder="Name"><input type="text" id="nc" list="cl" placeholder="Class"><datalist id="cl">${opts}</datalist><select id="ng"><option>9</option><option>10</option></select><input type="number" id="nb" min="0" value="0" style="width:80px" aria-label="Fragments won so far"><button class="pri" data-act="addMem">Add member</button></div><small>The number is how many fragments they have already won.</small></div>`;
}
function adminView(){
  const h=S.history.map((x,i)=>({x,i})).reverse().slice(0,30);
  return`<div class="box"><h3>Add an auction day</h3><div class="row"><input type="date" id="nd"><button class="pri" data-act="addAuc">Add auction</button></div><small>Auctions run on Tuesday, Thursday and Sunday.</small></div>
  <div class="box"><h3>Recent wins</h3>${h.length?`<table><tr><th>Date</th><th>Member</th><th></th></tr>${h.map(({x,i})=>`<tr><td>${x.date}</td><td>${esc((byId(x.mid)||{name:'(removed)'}).name)}</td><td><button class="del" data-act="undo" data-i="${i}">Undo</button></td></tr>`).join('')}</table>`:'<p class="empty">No wins recorded yet. Use "Mark won" on an auction.</p>'}</div>
  <div class="box"><h3>Backup</h3><p>Your data is saved in this browser only. Save a backup file to keep it safe or move it to another device.</p><div class="row"><button class="pri" data-act="backup">Save backup file</button><label>Load backup: <input type="file" id="rf" accept=".json"></label><button data-act="csv">Download CSV</button><button class="del" data-act="reset">Reset to starting data</button></div></div>`;
}
function render(){
  P=plan();
  document.body.classList.toggle('admin',$('#admtog').checked);
  if(tab=='admin'&&!$('#admtog').checked)tab='auctions';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));
  const auc=[...S.auctions].sort((a,b)=>a.date<b.date?-1:1);
  const up=auc.filter(a=>pd(a.date)>=today()),pa=auc.filter(a=>pd(a.date)<today());
  $('#v').innerHTML=(status?`<p class="empty">${status}</p>`:'')+(tab=='auctions'?(up.map(card).join('')||'<p class="empty">No upcoming auctions. Turn on Admin mode to add one.</p>')+(pa.length?`<details><summary>${pa.length} past auction${pa.length>1?'s':''}</summary><div style="margin-top:10px">${pa.reverse().map(card).join('')}</div></details>`:''):tab=='members'?membersView():adminView());
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const ACT={
  won(e){const d=e.dataset.d,m=byId(e.dataset.m),a=aucn(d);if(wins(d,m.group)>=a.avail[m.group])return alert(`Group ${m.group} has no fragments left for this auction.`);S.history.push({date:d,mid:m.id,n:1})},
  req(e){const s=e.parentNode.querySelector('select');if(!s.value)return alert('Choose your name first.');S.requests.push({date:e.dataset.d,mid:+s.value})},
  unreq(e){S.requests.splice(+e.dataset.i,1)},
  av(e){const a=aucn(e.dataset.d),g=e.dataset.g;a.avail[g]=Math.max(0,Math.min(2,a.avail[g]+ +e.dataset.v))},
  addAuc(){const v=$('#nd').value;if(!v)return alert('Pick a date.');if(aucn(v))return alert('That date is already listed.');if(![0,2,4].includes(pd(v).getDay())&&!confirm('That day is not a Tuesday, Thursday or Sunday. Add it anyway?'))return;S.auctions.push({date:v,groups:[],avail:{9:2,10:2}})},
  delAuc(e){if(confirm('Delete this auction and its requests?')){S.auctions=S.auctions.filter(a=>a.date!=e.dataset.d);S.requests=S.requests.filter(r=>r.date!=e.dataset.d)}},
  addMem(){const n=$('#nm').value.trim(),c=$('#nc').value.trim();if(!n||!c)return alert('Enter a name and a class.');S.members.push({id:S.nid++,name:n,cls:c,group:+$('#ng').value,base:Math.max(0,+$('#nb').value||0),ord:Math.max(-1,...S.members.map(m=>m.ord))+1})},
  delMem(e){const m=byId(e.dataset.m);if(confirm(`Remove ${m.name}? Their win history is removed too.`)){S.members=S.members.filter(x=>x.id!=m.id);S.history=S.history.filter(h=>h.mid!=m.id);S.requests=S.requests.filter(r=>r.mid!=m.id);S.auctions.forEach(a=>{for(const g in a.manual||{})a.manual[g]=a.manual[g].filter(x=>x!=m.id)})}},
  move(e){const m=byId(e.dataset.m),q=queue(m.group).map(x=>x.m),i=q.indexOf(m),o=q[i+ +e.dataset.v];if(!o)return;[m.ord,o.ord]=[o.ord,m.ord]},
  refresh(){},
  undo(e){S.history.splice(+e.dataset.i,1)},
  backup(){dl('guild-bidding-backup.json',JSON.stringify(S),'application/json')},
  csv(){dl('guild-members.csv','Group,Name,Class,Total won\n'+[10,9].flatMap(g=>queue(g).map(x=>[g,x.m.name,x.m.cls,x.t].map(v=>`"${v}"`).join(','))).join('\n'),'text/csv')},
  reset(){if(confirm('Replace everything with the starting data from your CSV?'))S=DEF()}
};
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return render()}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,n=S.requests.length,r0=S.requests[+b.dataset.i];
  if(act=='refresh'){status='';return pull()}
  ACT[act](b);save();render();
  if(!live()||act=='backup'||act=='csv')return;
  try{
    if(act=='req'){if(S.requests.length>n){const r=S.requests[S.requests.length-1];const x=await api({action:'request',date:r.date,mid:r.mid});if(x.error)alert(x.error)}}
    else if(act=='unreq'){const x=await api({action:'unreq',pass:PASS,date:r0.date,mid:r0.mid});if(x.error)alert(x.error)}
    else return push();
  }catch(e){alert('Could not reach the shared sheet. Try again.')}
  pull()});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id=='admtog'){
    if(t.checked&&live()){
      t.checked=false;t.disabled=true;$('#admst').textContent=' Checking...';
      const p=prompt('Admin passcode');let ok=false;
      if(p){try{ok=(await api({action:'check',pass:p})).ok}catch(e){}}
      t.disabled=false;$('#admst').textContent='';
      if(ok){t.checked=true;PASS=p;sessionStorage.setItem('pw',p);if(serverEmpty)push()}else if(p)alert('Passcode not accepted.')}
    return render()}
  if(t.dataset.cls){const m=byId(t.dataset.cls),v=t.value.trim();if(v)m.cls=v;save();render();push();return}
  if(t.dataset.man){const a=aucn(t.dataset.d),g=t.dataset.man;a.manual=a.manual||{};if(t.checked)a.manual[g]=[];else delete a.manual[g];save();render();push();return}
  if(t.dataset.pick){const a=aucn(t.dataset.d),g=t.dataset.g,id=+t.dataset.pick,l=a.manual[g]||[];if(t.checked){if(l.length>=a.avail[g]){t.checked=false;return alert(`Group ${g} only has ${a.avail[g]} fragment(s) available. Raise the number or untick someone first.`)}a.manual[g]=[...l,id]}else a.manual[g]=l.filter(x=>x!=id);save();render();push();return}
  if(t.dataset.grp){const a=aucn(t.dataset.d),g=+t.dataset.grp;a.groups=t.checked?[...new Set([...a.groups,g])]:a.groups.filter(x=>x!=g);save();render();push()}
  if(t.id=='rf'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.members)||!Array.isArray(d.auctions))throw 0;d.members.forEach((m,i)=>{if(m.ord==null)m.ord=i});S=d;save();render();push()}catch(e){alert('That file is not a valid backup.')}};r.readAsText(t.files[0])}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
$('#admtog').checked=false;
render();pull();
</script>
</body>
</html>
